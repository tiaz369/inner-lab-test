const THEMES={
confidence:{label:['自信与自己','Self-trust'],icon:'sun',title:['我已经，站在自己这边。','I am on my own side.'],identity:['我已经成为一个愿意相信自己的人。我的想法有位置，我的声音也有位置。我可以温和地表达需求，不必先得到所有人的许可。我做选择时，会认真听听自己，而不是只听外面的声音。','I am someone who stands beside myself. My ideas have a place here, and so does my voice. I speak about what I need with kindness, without waiting for everyone to agree. I have learned to listen to myself as carefully as I listen to the world.'],affirm:['我温柔而坚定地，站在自己这边。','I stand beside myself, gently and firmly.'],action:['我用五分钟，写下今天愿意为自己做的一件小事，再写下它的第一个动作。可以是一句清楚的表达，也可以是一次真诚的拒绝。我已经给它留出了位置。','I take five minutes to write down one thing I choose for myself today, then its very first step. It might be one clear sentence, or one kind boundary. I have already made room for it.']},
career:{label:['事业与方向','Work & direction'],icon:'briefcase',title:['我的步调，也有方向。','My own pace has a direction.'],identity:['我已经成为一个认真对待自己能力的人。我的价值不只来自一份职位或一次评价。我做着有意义的事，也为学习留着空间。我可以表达自己的想法，可以请求帮助，也可以在不合适的地方重新选择。','I am someone who takes my abilities seriously. My value is larger than a job title or a single opinion. I do meaningful work and leave room to learn. I can share an idea, ask for support and choose again when a direction no longer fits.'],affirm:['我以自己的步调，走向有意义的事。','I move at my own pace towards meaningful work.'],action:['我已经在纸上写下一项自己做得到的能力。今天，我用八分钟补上一件具体的例子，保存成一条简短的作品或经历记录。不必完成整份计划，先留下这个真实的小证据。','I have written down one ability I can rely on. Today I give myself eight minutes to add a concrete example, saving it as a short note about something I have done. I do not need a whole new plan tonight. One real piece of evidence is enough.']},
love:{label:['爱与关系','Love & connection'],icon:'heart',title:['爱里，有尊重，也有我。','There is room for me in love.'],identity:['我值得一段互相尊重的关系。我已经学会认真听见自己的感受，也尊重另一个人自由选择的权利。我不需要让某个特定的人改变心意，来证明自己值得被爱。我可以靠近，也可以为自己保留边界。','I deserve a mutually respectful relationship. I listen to my own feelings and respect another person’s freedom to choose. I do not need to change one particular person’s mind to prove I am worthy of love. I can welcome connection and still keep my boundaries.'],affirm:['我值得一段互相尊重的关系。','I deserve a mutually respectful relationship.'],action:['我用五分钟，写下让我感到被尊重的三件小事。然后选择其中一件，先在今天的生活里给自己。不需要联系任何特定的人，也不需要等别人的回应，我已经能够照顾自己的感受。','I take five minutes to write down three small things that help me feel respected. Then I choose one I can offer myself today. I do not have to contact a particular person or wait for a reply. I am already able to care for what I feel.']},
home:{label:['家与生活','Home & belonging'],icon:'home',title:['在自己的生活里，安一个家。','At home in a life of my own.'],identity:['我已经成为一个愿意为自己安顿生活的人。我不必等到拥有理想的地址，才值得被温柔对待。我可以挑选喜欢的细节，也可以把不再需要的东西放下。这个空间，不是为了向谁证明什么，而是为了让我自在地生活。','I am someone who makes a life feel like home. I do not need an ideal address before I deserve gentleness. I choose the details I love and let go of things I no longer need. This space is not here to impress anyone. It is here to help me live as myself.'],affirm:['我在自己的生活里，安了家。','I am at home in a life of my own.'],action:['我已经选好了一个很小的角落。今天，我用八分钟整理它，擦净一张桌面，或者把喜欢的杯子放到手边。不需要买任何东西。我亲手照顾的这一点，就是现在可以抵达的家。','I have chosen one small corner. Today I give it eight minutes: a clear surface, a favourite cup within reach, or a place to put down my bag. I do not need to buy anything. This little piece of care is a home I can reach right now.']},
wellbeing:{label:['休息与身心','Rest & wellbeing'],icon:'leaf',title:['我给自己，留出了余地。','There is room for me to rest.'],identity:['我已经成为一个愿意听见自己需要的人。休息不是完成所有事情之后才能得到的奖赏。我可以放慢，可以调整安排，也可以请求合适的支持。我的身体不需要变成某种样子，才值得被善待。','I am someone who listens to what I need. Rest is not a prize I receive only after every task is done. I can slow down, change a plan and ask for appropriate support. My body does not have to look a certain way before it deserves kindness.'],affirm:['我值得休息，也值得被照顾。','I deserve rest and thoughtful care.'],action:['我已经给今天留下一段五分钟的空白。我把屏幕放到一边，喝一点水，或坐到舒服的位置，留意自己此刻需要什么。这不替代专业照护，只是我可以为自己做的一件小事。','I have left five unclaimed minutes in today. I put a screen aside, have some water or sit somewhere comfortable, and notice what I need. This is not a replacement for professional care. It is one small act of care I can choose right now.']},
learning:{label:['学习与成长','Learning & growth'],icon:'book',title:['我已经，给成长留了空间。','I have made room to grow.'],identity:['我已经成为一个允许自己慢慢学会的人。一次结果不能决定我的全部。我可以承认暂时不懂，也可以把问题拆小，再问一次。我认真对待自己的努力，也为休息留出位置。','I am someone who allows learning to take time. A single result does not define me. I can admit what I do not know, make a question smaller and ask it again. I respect the effort I bring, and I leave room for rest as well.'],affirm:['我允许自己，一点一点学会。','I allow myself to learn, one step at a time.'],action:['我已经把下一步变得很小。今天，我用八分钟，只读一小段，或者只做一道练习，再用自己的话写下一个要点。不保证任何考试结果，只把注意力放回眼前这一件能做的事。','I have made the next step small enough to begin. Today I take eight minutes to read one short passage or try one practice question, then write one thing in my own words. No result is guaranteed. My attention belongs to the step in front of me.']}
};
const SCENES={
sea:{label:['海边的早晨','A morning by the sea'],match:/海|沙滩|ocean|sea\b|coast|beach/i,zh:'我在海边的房间醒来。淡粉色的天空安静地铺在窗外，远处的海面缓慢起伏。我推开窗，空气里有一点清凉的盐味。手边的杯子温热，光落在我挑选的布料和木头上。我没有急着查看消息，先坐下来，听见这个早晨，也听见自己。',en:'I wake in a room beside the sea. A pale pink sky rests beyond the window, and the water moves slowly in the distance. I open the window to cool, salty air. My cup is warm in my hands. Light rests on the linen and wood I chose. I sit for a moment before reaching for any messages. This morning belongs to my life, and I am here for it.'},
garden:{label:['花园里的一点阳光','Sunlight in a garden'],match:/花园|花|树|自然|garden|flower|tree|nature/i,zh:'我在有花园的屋子里醒来。叶子在窗外轻轻动着，温柔的光落进房间。我捧着一杯热茶，慢慢走到门边。空气里有潮湿泥土的味道，也有早晨的清新。我没有急着开始所有事，先看一眼花，再看一眼天空。这些微小的细节，已经成为我愿意认真生活的理由。',en:'I wake in a room that opens onto a garden. Leaves shift beyond the window, and gentle light reaches the floor. I carry a warm cup of tea to the doorway. There is the scent of damp earth and the freshness of a new morning. I do not begin every task at once. I notice a flower, then the sky. These small details have become part of a life I am here to enjoy.'},
city:{label:['城市里，从容的一天','An unhurried city day'],match:/城市|公寓|工作室|咖啡|city|apartment|studio|cafe/i,zh:'我在城市的公寓里醒来。窗帘透进柔软的晨光，街道的声音还很远。我给自己倒一杯热茶，坐在干净的桌边。房间里有几件我认真挑选的小东西，不昂贵，却都合心意。今天的安排留着余地，我不再一醒来就追赶时间。我已经在忙碌的世界里，给自己留出一块从容的位置。',en:'I wake in my city apartment. Soft morning light finds its way through the curtains, and the sounds of the street are still distant. I pour a warm tea and sit at a clear table. A few things I chose with care make this room feel like mine. There is space between the plans for today. I no longer begin the morning by chasing it. I have made a quiet place for myself in a busy world.'},
quiet:{label:['安静、属于自己的空间','A quiet space of my own'],match:/.*/,zh:'我在柔和的晨光里醒来。房间安静，窗边有一杯温热的茶。我慢慢坐起来，看见这个空间里熟悉而喜欢的细节。生活不必每一处都完美，我已经可以在平常的一天里，找到属于自己的位置。我先听听周围的声音，再把注意力放回此刻。我不需要急着赶上谁，这一天有我的步调。',en:'I wake to gentle morning light. The room is quiet, and a warm cup of tea waits by the window. I sit up slowly and notice the familiar details I love. Life does not have to be perfect in every corner for me to belong in it. I listen to the room, then return my attention to this moment. I do not need to catch up with anyone before the day can begin. There is room for my own pace.'}
};
const VOICES={calm:{name:['轻柔','Soft'],desc:['慢一点，留一点空白','A gentler pace, with a little space'],rate:.88,pitch:1.04},grounded:{name:['沉静','Grounded'],desc:['安稳、自然、不急促','Steady, natural and unhurried'],rate:.86,pitch:.85},clear:{name:['明亮','Clear'],desc:['清晰一点，轻快一点','A little lighter and clearer'],rate:.98,pitch:1.12}};
function crisisWords(s){return /自杀|自殺|自残|自殘|伤害自己|傷害自己|不想活|活不下去|活着没意思|活著沒意思|结束生命|結束生命|想死|想去死|撑不下去|撐不下去|割腕|轻生|輕生|suicid|kill\s*(myself|me)|harm\s*myself|hurt\s*myself|self[\s-]*harm|end\s*(my\s*)?life|want\s+to\s+die|wanna\s+die|wish\s+i\s+(was|were)\s+dead|don[’']?t\s+want\s+to\s+(live|be\s+alive)|can[’']?t\s+(go\s+on|keep\s+living)|overdose/i.test(s);}
function sceneFromAnswer(s){for(const[id,v]of Object.entries(SCENES))if(v.match.test(s))return id;return 'quiet';}
// Free text is never echoed into the story: only approved scene categories are used.
// Thus arbitrary names cannot survive, including names a heuristic detector might miss.
function personalSections(){const i=state.lang==='zh'?0:1,th=THEMES[state.sessionTheme||state.theme];return [
{section:'scene',text:SCENES[state.scene][state.lang]},
{section:'identity',text:(state.relationshipRequested&&th!==THEMES.love?THEMES.love.affirm[i]+' ':'')+th.identity[i]},
{section:'feeling',text:local(['我感到肩膀慢慢松下来，呼吸也回到自然的节奏。我不需要制造一种特别强烈的情绪，平静、期待，甚至一点犹豫，都可以在这里。此刻的踏实，来自我愿意照顾自己，而不是来自外界必须发生什么。我已经能够看见自己喜欢的生活，也能够分辨，哪些细节是我真正想要的。','I feel my shoulders soften and my breath return to its own rhythm. I do not need to create a powerful emotion. Calm, hope and even a little uncertainty can share this space. The steadiness I feel comes from being willing to care for myself, not from the world having to behave a certain way. I can recognise the details of a life I genuinely want.'])},
{section:'obstacle',text:local(['我也记得以前迟疑的自己。那时，我常常觉得必须先准备得很好，才可以开始。现在，我已经学会把很大的担心拆成一个小问题。害怕有时还会出现，但它不再替我做所有决定。如果今天不顺利，我可以停下来，调整，再继续。过去的我已经很努力，而现在的我，有了更温柔也更具体的办法。','I remember the version of me who hesitated. I used to think I had to be completely ready before I could begin. Now I have learned to turn a very large worry into one smaller question. Fear still visits, but it no longer makes every decision. If today is difficult, I can pause, adjust and continue. The person I was worked hard. The person I am now has a kinder, more practical way forward.'])},
{section:'action',text:th.action[i]+' '+th.affirm[i]}
];}

THEMES.abundance={label:['丰盛与金钱','Abundance'],icon:'sun',title:['我的生活，有选择的余地。','There is room for choice in my life.'],identity:['我已经成为一个愿意认真照顾资源的人。我的价值不由账户的数字决定。我可以看清需要，做出选择，也可以向可信赖的人请求建议。丰盛对我来说，是有余地照顾现在的自己，而不是保证财富会自动出现。','I am someone who treats my resources with care. My worth is not a number in an account. I can understand a need, make a choice and ask a trustworthy person for advice. Abundance means room to care for my life, not a promise that wealth arrives on its own.'],affirm:['我认真照顾自己，也珍惜拥有的选择。','I care for myself and the choices I have.'],action:['我已经给这件事留了五分钟。今天，我写下一项实际需要，再写下一件暂时不必购买的东西。可以不做任何交易，只先看清自己的选择。如果有债务压力，我会寻求合适的专业建议。','I have left five minutes for this. Today I write down one real need and one thing I do not need to buy yet. I do not have to make a transaction. I can begin by understanding my choices. If debt is a concern, I seek appropriate professional advice.']};
THEMES.luck={label:['好运与可能','Luck & possibility'],icon:'sun',title:['我已经，看见新的可能。','I am noticing new possibilities.'],identity:['我已经成为一个愿意留意生活的人。好运不是我必须相信的魔法，而是我可以看见的机会、善意和连接。我不必把偶然解释成命运，也不需要责怪自己曾经错过什么。我可以带着好奇，认真回应眼前的一件事。','I am someone who pays attention to life. Luck does not have to mean magic. It can mean noticing an opportunity, a kindness or a connection. I do not need to turn coincidence into destiny or blame myself for what I missed. I can respond with curiosity to one thing in front of me.'],affirm:['我带着好奇，迎接眼前的可能。','I meet today’s possibilities with curiosity.'],action:['我已经打开了一点好奇心。今天，我用五分钟记下一件真实的小善意，或者留意一个自己能够回应的机会。不需要冒险下注，也不保证任何结果。我只是更认真地，看见眼前的生活。','I have made a little room for curiosity. Today I take five minutes to note one real kindness or one opportunity I can respond to. I do not need to gamble or expect a guaranteed result. I am simply paying more thoughtful attention to the life in front of me.']};

const SESSION_WEIGHTS=CONFIG.recommendations.intentionWeights;
const TIME_WEIGHTS=CONFIG.recommendations.timeWeights;
function dayPeriod(date=new Date()){const h=date.getHours();return h>=CONFIG.recommendations.lateHour||h<5?'night':h<12?'morning':h<18?'day':'evening'}
function scoreSessions(date=new Date()){const period=dayPeriod(date),weights=SESSION_WEIGHTS[state.theme];return CONTENT_TYPES.map(type=>{const intention=weights[type.mode]||0,time=TIME_WEIGHTS[period][type.mode]||0,recent=state.lastSession?.mode===type.mode?-CONFIG.recommendations.repeatPenalty:0;return {mode:type.mode,score:intention+time+recent,components:{intention,time,recent},period}}).sort((a,b)=>b.score-a.score);}
function ensureTodayPlan(){const period=dayPeriod();if(!state.todayPlan||state.todayPlan.date!==todayKey()||state.todayPlan.intention!==state.theme||(!state.todayPlan.manual&&state.todayPlan.period!==period)){const pick=scoreSessions()[0];state.todayPlan={date:todayKey(),intention:state.theme,mode:pick.mode,period,score:pick.score,components:pick.components,manual:false};persist()}return state.todayPlan;}

let lines=[],speechToken=0,currentUtterance=null,nextSpeechTimer=null,sampleInterval=null,sampleTimeout=null,sleepTimeout=null,timerDeadline=0;
function basicSections(mode){const samples={morning:['我把今天的第一口呼吸，留给自己。我不需要一次完成所有事。我已经选好一件最重要的小事，也为中途的休息留着空间。遇见不确定时，我可以先问一个问题，再走一步。今天，我带着自己的步调开始。','I keep the first breath of the day for myself. I do not need to do everything at once. I have chosen one small thing that matters and left room to rest along the way. When uncertainty appears, I can ask one question and take one step. I begin today at my own pace.'],general1:['我已经走过今天。还有没做完的事，也有值得被看见的努力。我把肩膀放松一点，让手边的杯子温暖双手。我不必现在解决明天的一切。今晚，我把一件担心写在纸上，留到明天再看。我已经为休息留出了位置。','I have made my way through today. Some things are unfinished, and some efforts deserve to be noticed. I let my shoulders soften and feel a warm cup in my hands. I do not have to solve tomorrow tonight. I write down one worry and leave it for another day. I have made room to rest.'],general2:['我已经给自己的声音留了位置。我可以清楚地说出需要，也可以温和地说不。一个人的反应，不会决定我的全部价值。我把手放在舒服的位置，想起今天认真表达过的一个时刻。哪怕只有一句话，也算数。我已经站在自己这边。','I have made a place for my voice. I can express a need clearly and say no with kindness. One person’s reaction does not define my worth. I rest my hands somewhere comfortable and remember one moment when I expressed myself honestly. Even one sentence counts. I am on my own side.'],general3:['我已经把今天的下一步变小。不是完成整个计划，而是清出一小块桌面，写下一句话，或把一件工具放到手边。我用五分钟开始，也可以在五分钟后休息。这个动作不保证某个结果，却是我真正能做的一步。我愿意看见自己的这份努力。','I have made the next step smaller. Not a whole new plan, just a clear corner of the desk, a sentence on a page or one tool within reach. I begin with five minutes and I may rest after that. This action cannot guarantee an outcome, but it is a step I can really take. I am willing to notice that effort.']};return [{section:'scene',text:local(samples[mode]||samples.general1)}];}

'I find a comfortable place. I can sit or lie down, with my eyes open or softly closed. I notice where my body meets the chair, the bed or the floor. There is no perfect posture to achieve. For a moment, I let the support beneath me take some of the weight. I notice a sound nearby, then one a little further away. I do not need to decide whether I like them. I simply notice that I am here. Now I turn towards one natural breath. It does not have to be deep, and I do not need to count it precisely. As I breathe in, I notice the air passing. As I breathe out, I give my shoulders a little room to soften. If my thoughts reach for tomorrow or return to an earlier conversation, I can notice that gently. Wandering is not failure. It is something attention naturally does, and I can return once more. Perhaps there is tension, hope, or no particular feeling. None of it has to become something different. I am simply making a little space for this moment. At the end, I notice my hands, my feet and the room around me. I may stretch, or look slowly towards one familiar object. This quiet practice cannot guarantee a change, but I have done one real small thing for myself. I choose a gentle next action: some water, one clear corner, or noticing the next breath. I have returned to this moment.'

// Balanced semantic chunks: never discard text or shrink the active subtitle.
function semanticChunks(part,width,ctx){
 const zh=state.lang==='zh';
 let units;
 if(zh&&typeof Intl.Segmenter==='function')units=Array.from(new Intl.Segmenter('zh',{granularity:'word'}).segment(part),x=>x.segment);
 else units=zh?Array.from(part):part.split(/\s+/);
 const join=a=>a.join(zh?'':' '),out=[];
 while(units.length){
  const count=Math.max(1,Math.ceil(ctx.measureText(join(units)).width/width));
  const target=ctx.measureText(join(units)).width/count;
  let take=1;
  while(take<units.length){
   const current=ctx.measureText(join(units.slice(0,take))).width;
   const next=ctx.measureText(join(units.slice(0,take+1))).width;
   if(next>width||Math.abs(target-current)<Math.abs(target-next))break;
   take++;
  }
  let chunk=join(units.splice(0,take)).trim();
  // A single unusually long word can still be split without elision.
  if(ctx.measureText(chunk).width>width){let c='';for(const char of chunk){if(c&&ctx.measureText(c+char).width>width){out.push(c);c=char}else c+=char}if(c)out.push(c)}else if(chunk)out.push(chunk);
 }
 return out;
}
function makeLines(){
 const ctx=document.createElement('canvas').getContext('2d'),width=Math.min(430,innerWidth)-60;
 const current=document.querySelector('#currentLine');
 ctx.font=current?getComputedStyle(current).font:(state.lang==='zh'?'500 29px "Noto Serif SC",serif':'500 38px "Cormorant Garamond",serif');
 // The body language may change before this screen is rendered; explicit font families remain native.
 if(!ctx.font||ctx.font==='10px sans-serif')ctx.font=state.lang==='zh'?'500 29px "Noto Serif SC",serif':'500 38px "Cormorant Garamond",serif';
 const result=[];
 for(const sec of storySections()){
  const parts=sec.text.match(state.lang==='zh'?/[^，。！？；、：]+[，。！？；、：]?/g:/[^,.!?;:]+[,.!?;:]?/g)||[sec.text];
  for(const part of parts)for(const text of semanticChunks(part.trim(),width,ctx))result.push({text,section:sec.section});
 }
 lines=result;
}

let ambientToken=0,ambientContext=null,ambientMaster=null,ambientNodes=[],ambientInterval=null,ambientStarted=0,ambientElapsed=0;
COPY.zh.ambientUnavailable='当前浏览器不支持播放声景。其他旁白与呼吸练习仍可使用。';
COPY.en.ambientUnavailable='This browser cannot play the soundscape. Narration and breathing practices are still available.';
function buildAmbientPlayer(){return `<section class="screen player ambient-player"><div class="player-bg" style="background-image:url('${ASSETS.terrace}')"></div>${header({back:'library',brand:false,label:t('sleepType'),dark:true})}<div class="player-headings"><p class="eyebrow">${t('soundscape')} · ${t('sleepDuration')}</p><h1>${t('sleepTitle')}</h1><p class="fine" style="color:#fff9efb3;margin-top:14px">${t('ambientNote')}</p></div><div class="ambient-quiet">${light(176)}<p class="fine" style="color:#fff9efbb">${t('soundOnly')}</p></div><div class="player-controls"><div class="ambient-wave" aria-hidden="true">${Array.from({length:26},(_,i)=>`<i style="--h:${9+(i*13%23)}px;--d:${i*.11}s"></i>`).join('')}</div><div class="ambient-track"><i id="ambientProgress" style="width:${Math.min(100,ambientElapsed/6000)}%"></i></div><div class="timeline" style="margin-top:8px"><span id="ambientElapsed">${fmt(ambientElapsed/1000)}</span><span>10:00</span></div><div class="control-row"><button class="big-play" data-action="ambientToggle" id="ambientPlay" aria-label="${t(state.playing?'pause':'play')}">${icon(state.playing?'pause':'play',true)}</button></div><div class="player-extras"><button data-action="timer">${icon('moon')}${t('timer')} · ${state.timer?state.timer+' '+t('minutes'):t('off')}</button><button data-action="ambientEnd">${t('ambientEnd')}</button></div>${state.ended?button(t('finishSession'),'finish','player-finish'):''}<p class="ai">${t('ambientDescription')} · ${t('imageAi')}</p><p class="ai">${t('practice')}</p></div></section>`;}
function updateAmbient(){const total=ambientElapsed+(state.playing?Date.now()-ambientStarted:0);if(state.route==='player'&&state.mode==='sleep'){if($('#ambientElapsed'))$('#ambientElapsed').textContent=fmt(total/1000);if($('#ambientProgress'))$('#ambientProgress').style.width=Math.min(100,total/6000)+'%'}else updateMiniPlayer();}
function launchAmbient(){stopSpeech();stopAmbient();state.hasSession=true;state.mode='sleep';state.playerIndex=0;state.ended=false;state.route='player';ambientElapsed=0;render();startAmbient();}
async function startAmbient(){
const token=++ambientToken;try{
 if(!ambientContext){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast(t('ambientUnavailable'));return}
  ambientContext=new AC();const ctx=ambientContext,master=ctx.createGain();ambientMaster=master;master.gain.value=.16;master.connect(ctx.destination);
  const buffer=ctx.createBuffer(1,Math.round(ctx.sampleRate*4),ctx.sampleRate),data=buffer.getChannelData(0);let last=0;
  for(let i=0;i<data.length;i++){const white=Math.random()*2-1;last=(last+.02*white)/1.02;data[i]=last*3.5;}
  const noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;
  const lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=1800;
  const rain=ctx.createGain();rain.gain.value=.65;noise.connect(lowpass);lowpass.connect(rain);rain.connect(master);noise.start();ambientNodes=[noise];
  // Soft musical pad; values are synthesis parameters, never health/frequency claims.
  for(const tone of [130.81,196,261.63]){const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=tone;g.gain.value=.035;osc.connect(g);g.connect(master);osc.start();ambientNodes.push(osc)}
 }
 const context=ambientContext;await context.resume();if(token!==ambientToken||ambientContext!==context||state.mode!=='sleep')return;
 state.playing=true;state.ended=false;ambientStarted=Date.now();clearInterval(ambientInterval);if(ambientMaster)ambientMaster.gain.setTargetAtTime(.16,ambientContext.currentTime,.4);
 ambientInterval=setInterval(()=>{const total=ambientElapsed+Date.now()-ambientStarted;if(total>=600000){finishAmbient();ambientElapsed=600000;return}if(total>=592000&&ambientMaster)ambientMaster.gain.setTargetAtTime(0,ambientContext.currentTime,2);updateAmbient()},350);
 render({keepScroll:true});
}catch{state.playing=false;toast(t('ambientUnavailable'));}
}
function pauseAmbient(){ambientToken++;if(state.mode==='sleep'&&state.playing)ambientElapsed+=Date.now()-ambientStarted;clearInterval(ambientInterval);if(ambientContext?.state==='running')ambientContext.suspend().catch(()=>{});if(state.mode==='sleep')state.playing=false;}
function stopAmbient(){pauseAmbient();for(const n of ambientNodes){try{n.stop()}catch{}}ambientNodes=[];if(ambientContext){ambientContext.close().catch(()=>{});ambientContext=null}clearInterval(ambientInterval);}
function finishAmbient(){stopAmbient();state.ended=true;state.firstFinished=true;recordLastSession();markDay('session');render({keepScroll:true});}

let breathInterval=null,breathPhaseStarted=0,breathPhaseElapsed=0,breathStarted=false;
function buildBreathing(){const done=state.breathPhase==='done',active=!['ready','done'].includes(state.breathPhase);return `<section class="screen breathing">${header({back:'library',brand:false,label:PRODUCT_NAME,close:true})}<div class="content center"><p class="eyebrow">${t('breathType')} · ${state.breathCycle}/3</p><h1>${t('breatheTitle')}</h1><p class="body-copy">${t('breatheSub')}</p><div class="breathing-orb ${state.breathRunning?'running':''}" id="breathingOrb">${light(260,active||done)}</div><p class="breath-phase" id="breathPhase">${t(done?(state.breathEndedEarly?'breathEarly':'breathComplete'):active?state.breathPhase:'breathReady')}</p><p class="fine" id="breathCount">${done?state.breathCycle+' / 3':Math.min(3,state.breathCycle+1)+' / 3'} · ${t('breathCycle')}</p><p class="fine" style="margin-top:16px">${t('holdOptional')}</p></div><div class="spacer"></div><footer class="foot stack">${done?button(t(state.breathEndedEarly?'recordBreath':'finishSession'),'finishBreath'):button(t(state.breathRunning?'pauseBreath':breathStarted?'resumeBreath':'startBreath'),'breathToggle')}${state.breathPhase==='hold'?button(t('skipHold'),'skipHold','secondary'):''}${breathStarted&&!done?button(t('endBreath'),'endBreath','text-button'):''}${guard()}</footer></section>`;}
function launchBreathing(){stopSpeech();stopAmbient();stopBreathing();breathPhaseElapsed=0;breathStarted=false;state.breathEndedEarly=false;state.holdEnabled=false;state.breathPhase='ready';state.breathCycle=0;state.route='breath';render();}
function phaseDuration(){return state.breathPhase==='inhale'?4000:state.breathPhase==='hold'?2000:6000;}
function nextBreathPhase(){breathPhaseElapsed=0;breathPhaseStarted=Date.now();if(state.breathPhase==='inhale')state.breathPhase=state.holdEnabled?'hold':'exhale';else if(state.breathPhase==='hold')state.breathPhase='exhale';else{state.breathCycle++;if(state.breathCycle>=3){finishBreathing();return}state.breathPhase='inhale'}render({keepScroll:true});}
function updateBreathing(){if(state.route!=='breath'||!state.breathRunning)return;const elapsed=breathPhaseElapsed+Date.now()-breathPhaseStarted,duration=phaseDuration();if(elapsed>=duration){nextBreathPhase();return}const p=elapsed/duration,scale=state.breathPhase==='inhale'?.84+.24*p:state.breathPhase==='hold'?1.08:1.08-.24*p;const orb=$('#breathingOrb');if(orb)orb.style.transform=`scale(${scale})`;}
function startBreathing(){if(['ready','done'].includes(state.breathPhase)){state.breathPhase='inhale';state.breathCycle=0;breathPhaseElapsed=0}breathStarted=true;state.breathRunning=true;breathPhaseStarted=Date.now();clearInterval(breathInterval);breathInterval=setInterval(updateBreathing,80);render({keepScroll:true});}
function pauseBreathing(){if(state.breathRunning)breathPhaseElapsed+=Date.now()-breathPhaseStarted;state.breathRunning=false;clearInterval(breathInterval);if(state.route==='breath')render({keepScroll:true});}
function stopBreathing(){clearInterval(breathInterval);state.breathRunning=false;}
function finishBreathing(early=false){stopBreathing();state.breathEndedEarly=early;state.breathPhase='done';if(!early){state.breathCycle=3;state.firstFinished=true;state.mode='breath';recordLastSession();markDay('session')}render({keepScroll:true});}

case 'closeModal':closeModal();break;
case 'replay':state.breaths=0;state.lit=false;go('ritual');break;

const personalSectionsV3=personalSections;
personalSections=function(){const th=THEMES[state.sessionTheme||state.theme],i=state.lang==='zh'?0:1;return [{section:'scene',text:SCENES[state.scene][state.lang]},{section:'identity',text:th.identity[i]},{section:'feeling',text:local(['我感到自己已经住在这幅生活里。指尖触到杯子的温度，空气轻轻经过皮肤。我不需要把情绪推高；柔软、安心、满足，就是此刻的质地。这是我愿意成为的自己，也是我此刻正在感受的生活。','I feel at home in this scene. My fingertips meet the warmth of the cup. Air brushes my skin. I do not have to make the feeling intense. Ease, warmth and contentment are enough. I am here as the person I choose to be.'])},{section:'obstacle',text:local(BRIDGES[state.sessionTheme||state.theme])},{section:'action',text:local(['我把这份感受带回今天。一个温柔的小选择，就能是开始。','I bring this feeling into today. One gentle choice is a place to begin.'])+' '+local(th.affirm)}]};
storySections=function(){if(state.mode!=='personal')return genericSections(state.mode);const story=state.stories.find(s=>s.id===state.activeStoryId);return story?.sections[state.lang]||personalSections()};
const genericSectionsV3=genericSections;
genericSections=function(mode){const th=state.sessionTheme||state.theme,i=state.lang==='zh'?0:1;if(mode==='affirmAudio')return [THEMES[th].affirm,BRIDGES[th],FRAME_LINES[th],BRIDGES[th],THEMES[th].affirm].map(x=>({section:'identity',text:x[i]}));if(mode==='meditation'){const text=local(['找一个舒服的位置，让眼睛轻轻闭上，或落在房间里的一个点。感到身体正被支撑着，不必把呼吸变深。听见一处近的声音，再让它远去。现在，给心里想要的生活留一点位置。不需要证明，也不需要马上相信。','Find a comfortable position. Let your eyes close or rest on a quiet point. Notice the support beneath you. Your breath can stay natural. Hear a sound nearby and let it pass. Make a little room for the life you want, with nothing to prove and no need to force belief.']);return [{section:'scene',text},{section:'identity',text:local(FRAME_LINES[th])},{section:'feeling',text:local(['想象它的光线，温度，以及你在其中的姿态。停留一会儿。若有怀疑，它也可以在这里。','Notice its light, its temperature and how you carry yourself there. Stay for a moment. Doubt can have a place here too.'])},{section:'obstacle',text:local(BRIDGES[th])},{section:'action',text:local(['再感到椅子、地面和身边的空气。你可以把这一点感受带回去，也可以只是休息。慢慢睁眼，回到这里。','Feel the chair, the floor and the air around you. Carry a little of this feeling with you, or simply rest. Open your eyes in your own time.'])}]}return genericSectionsV3(mode)};

beginSelectedSession=function(mode,theme=state.theme){if(state.crisisActive)return;if(mode==='personal'){if(!state.activeStoryId&&!createLocalStory())return;const story=state.stories.find(x=>x.id===state.activeStoryId);state.sessionTheme=story?.theme||theme}else state.sessionTheme=theme;state.pendingMode=mode;state.breaths=0;state.lit=false;if(mode==='breath')launchBreathing();else if(mode==='morning')go('frame');else go('ritual')};

const scoreSessionsV3=scoreSessions;
scoreSessions=function(date=new Date()){const scores=scoreSessionsV3(date);const yesterday=new Date(date);yesterday.setDate(date.getDate()-1);const y=[yesterday.getFullYear(),yesterday.getMonth()+1,yesterday.getDate()].join('-');for(const s of scores){if(state.preferredMode===s.mode)s.score+=3;if(state.lastSession?.date===y&&state.lastSession.mode===s.mode)s.score-=100;if(s.mode==='personal'&&!state.stories.length&&quotaInfo().remaining===0)s.score-=100}return scores.sort((a,b)=>b.score-a.score)};

handle=function(action,el){
 const textFields=Array.from(document.querySelectorAll('textarea,input[type=text]'));
 if(!['closeModal','help','helpRegion','crisisBack','language','go'].includes(action)&&textFields.some(x=>safetyKind(x.value)!=='ok')){const bad=textFields.find(x=>safetyKind(x.value)!=='ok');const k=safetyKind(bad.value);textFields.forEach(x=>x.value='');rejectInput(k);return}
 switch(action){

 case 'frameConfirm':state.mode='morning';markDay('session');stopFrame();go('home');return;

 case 'generate':state.dream='';stopSpeech();generate();return;
 case 'libraryItem':{const item=LIBRARY.find(x=>x.id===el.dataset.value);if(!item)return;if(item.id==='newStory'){storyShelf();return}if(!libraryAccessible(item)){showPaywall('locked',item);return}const th=LIBRARY_THEMES.find(x=>x.id===(item.primaryTheme||state.libraryTheme))?.theme||state.theme;state.demoFixedTitle=item.title?local(item.title):'';beginSelectedSession(item.mode||({story:'personal',meditation:'meditation',affirmations:'affirmAudio',sleep:'sleep',breath:'breath'})[item.type],th);return}
 case 'startFirstSession':closeModal();beginSelectedSession('personal',state.theme);return;
 case 'v4Paywall':closeModal();showPaywall('completion');return;
 case 'simulateTrial':{if(state.entitlement.trialUsed){toast(local(['试用仅一次。可在设置模拟已订阅期。','One trial only. Simulate a paid period in Settings.']));return}state.entitlement={status:'trial',plan:state.paywallPlan,trialUsed:true,trialEnd:Date.now()+7*86400000};persist();go('home');toast(local(['已进入模拟试用，不会扣款。','Trial simulated. No payment.']));return}
 case 'simulateSubscriber':state.entitlement={...state.entitlement,status:'subscriber',trialUsed:true,plan:state.entitlement.plan||'annual'};persist();closeModal();render({keepScroll:true});toast(local(['已模拟订阅期：每周 3 段新故事。','Paid period simulated: 3 new stories a week.']));return;

 case 'swapAction':state.actionStates[todayKey()]={index:(actionState().index+1)%3,skipped:false};state.actionDates=state.actionDates.filter(x=>x!==todayKey());persist();render({keepScroll:true});return;
 case 'skipAction':state.actionStates[todayKey()]={...actionState(),skipped:!actionState().skipped};state.actionDates=state.actionDates.filter(x=>x!==todayKey());persist();render({keepScroll:true});return;

 case 'dataExport':exportData();return;
 case 'saveReview':{const answers=[1,2,3].map(n=>$('#review'+n)?.value.trim()||'');if(!answers.some(Boolean)){toast(t('reviewEmpty'));return}if(!answers.every(validateInput))return;state.reviews.unshift({answers,date:new Date().toLocaleDateString(state.lang==='zh'?'zh-CN':'en-GB'),preferred:$('#reviewPreference')?.value||''});state.preferredMode=$('#reviewPreference')?.value||'';state.todayPlan=null;persist();closeModal();render({keepScroll:true});toast(local(['回顾已保存；偏好会影响后续推荐。','Saved. Your preference shapes future recommendations.']));return}
 case 'snapshots':openModal(()=>`<h2 id="sheetTitle">${local(['当时的那一帧','The scene as it was'])}</h2><p class="fine">${local(['保存完成练习时的意图与画面分类，不用今天的愿望重写过去。','Intention and scene category at completion, never redrawn from today’s wish.'])}</p>${state.snapshots.map(s=>`<article class="notice"><p>${esc(local(s.line))}</p><small>${s.date} · ${local(SCENES[s.scene].label)} · ${s.language}</small></article>`).join('')||`<p>${local(['还没有练习快照。','No practice snapshots yet.'])}</p>`}`);return;
 case 'helpRegion':state.helpRegion=el.dataset.value;persist();if(state.route==='crisis')render();else supportModal();return;
 case 'crisisBack':state.dream='';state.crisisActive=false;go(state.onboarded?'home':'welcome');return;
 case 'clearYes':stopSpeech();stopAmbient();stopBreathing();stopFrame();clearTimeout(genTimer);clearTimeout(paywallAutoTimer);v4Deleting=true;try{localStorage.removeItem(STORE_KEY)}catch{}location.reload();return;
 }
 handleV3(action,el)
};
